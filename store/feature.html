<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{
    font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;
    background:linear-gradient(115deg,#FFB5CF 0%,#F58CB4 38%,#E96A9C 72%,#D9558B 100%);
    position:relative;
  }
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
  .g1{width:420px;height:420px;left:-120px;top:-160px;background:#FFD9E6}
  .g2{width:380px;height:380px;right:-90px;bottom:-150px;background:#B44A7E;opacity:.45}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);
    background-size:56px 56px;mask-image:linear-gradient(100deg,rgba(0,0,0,.9),transparent 70%)}
  .wrap{position:relative;height:100%;display:flex;align-items:center;padding:0 62px;gap:44px}
  .card{width:216px;height:216px;flex:none;border-radius:52px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 24px 54px rgba(90,30,60,.34)}
  .logo{width:172px;height:172px;border-radius:40px}
  .txt{flex:1;min-width:0}
  .brand{display:flex;align-items:baseline;gap:16px}
  .brand h1{font-size:96px;font-weight:900;color:#fff;letter-spacing:-4px;
    line-height:1;text-shadow:0 6px 18px rgba(120,30,70,.42)}
  .brand span{font-size:34px;font-weight:900;color:#4A352F;letter-spacing:-1px;
    background:rgba(255,255,255,.82);padding:7px 18px;border-radius:999px}
  .tag{margin-top:20px;font-size:37px;font-weight:800;color:#fff;letter-spacing:-1.4px;
    text-shadow:0 3px 12px rgba(120,30,70,.35)}
  .sub{margin-top:10px;font-size:23px;font-weight:600;color:rgba(255,255,255,.93);letter-spacing:-.8px}
  .chips{margin-top:28px;display:flex;gap:11px;flex-wrap:wrap}
  .chip{font-size:21px;font-weight:800;color:#4A352F;letter-spacing:-.8px;
    background:rgba(255,255,255,.9);border-radius:999px;padding:11px 21px;
    box-shadow:0 6px 16px rgba(120,30,70,.2)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
<div class="wrap">
  <div class="card"><img class="logo" src="logo.png" alt=""></div>
  <div class="txt">
    <div class="brand"><h1>강톡</h1><span>강남톡방</span></div>
    <div class="tag">강남의 모든 공간, 실시간 한눈에</div>
    <div class="sub">현황판으로 지금 자리를 확인하고, 바로 문의하세요</div>
    <div class="chips">
      <div class="chip">실시간 현황판</div>
      <div class="chip">가게찾기</div>
      <div class="chip">초톡 문의</div>
      <div class="chip">제휴관</div>
    </div>
  </div>
</div>
</body></html>
